# `native_toolchain_rust` wants an exact channel, so a release is built by a
# toolchain version control names. Same as Server Box's sbm_ffi, so both apps
# build their Rust with one toolchain.
[toolchain]
channel = "1.98.1"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]
