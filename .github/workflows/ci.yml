name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # `.github/workflows/cla.yml` cannot be tried out on GitHub without a
  # contributor watching, so its script is run here against a fake API.
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/cla_workflow_test.js

  # The bundle is checked in so an app building this package needs no JS
  # toolchain. This is what keeps it honest: rebuilt here, it must match.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          # The bundle is committed: the same bun must build the same bytes.
          bun-version: 1.3.14
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: 24
      - name: Build the bundle
        working-directory: fl_pi_llm/js
        run: npm ci && npm run build
      - name: Bundle and notices are up to date
        run: git diff --exit-code -- fl_pi_llm/rust/js/fl_pi_llm.js fl_pi_llm/THIRD_PARTY_NOTICES.md

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fl_pi_llm/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The Rust host (`host`, `reqwest`), without the Dart bridge.
      - run: cargo clippy --no-default-features --features reqwest --all-targets -- -D warnings
      - run: cargo test --no-default-features --features reqwest

  dart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fl_pi_llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: fl_pi_llm/rust
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fl_pi_llm_ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - run: flutter pub get
      - name: Generated l10n is current
        run: flutter gen-l10n && git diff --exit-code -- lib/generated
      - run: flutter analyze --fatal-infos

