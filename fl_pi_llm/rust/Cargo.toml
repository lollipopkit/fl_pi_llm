[package]
name = "fl_pi_llm"
version = "0.1.0"
edition = "2024"
description = "pi-durable and pi-ai on QuickJS, bridged to Dart"
license = "AGPL-3.0-only"


# Its own workspace root. An app that carries this package inside a Cargo
# workspace of its own — Server Box does — would otherwise have cargo take the
# crate for an unlisted member of that one and refuse to build it.
[workspace]

[lib]
name = "fl_pi_llm"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["frb"]
# The bridge to Dart (`api`), what the Flutter package builds.
frb = ["dep:flutter_rust_bridge", "dep:anyhow"]
# A Rust host (`host`): what a Rust program runs pi with, without Dart.
host = ["dep:tokio"]
# `host::ReqwestFetch`, HTTP for the Rust host.
reqwest = ["host", "dep:reqwest"]

[dependencies]
anyhow = { version = "1", optional = true }
flutter_rust_bridge = { version = "=2.13.0", optional = true }
getrandom = "0.4"
rquickjs = { version = "0.14", features = ["either"] }
regex = "1"
# The chats (`db`): SQLite3 Multiple Ciphers, built from source by build.rs
# the same on every target, so a chat is encrypted at rest. `in_gecko`: the
# bindings rusqlite bundles, and no SQLite of libsqlite3-sys's own linked.
# 0.39 too: a host whose sqlx 0.9 takes libsqlite3-sys below 0.38 (one
# `sqlite3` link per build) can still depend on this.
rusqlite = { version = ">=0.39, <0.41", features = ["in_gecko", "functions"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "fs", "io-util", "macros", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
# SKILL.md front matter (`skills`).
yaml-rust2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "fs", "io-util", "macros", "time"] }

# `rquickjs-sys` ships pre-generated bindings for neither iOS nor Android, so
# those two generate them at build time. `hook/bindgen_environment.dart` hands
# bindgen the platform's sysroot, which it cannot find on its own.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.14", features = ["either", "bindgen"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
cc = "1"
rquickjs = "0.14"
sqlite3mc-src = "205.1"
